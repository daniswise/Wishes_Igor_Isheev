<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>С Днём Рождения, Игорь!</title>
    <style>
        :root {
            --gold: #d4af37;       
            --dark-gold: #aa8c2c;  
            --black: #050505;      
            --white: #f5f5f5;
        }

        body {
            margin: 0; padding: 0;
            height: 100vh; width: 100vw;
            position: fixed; 
            top: 0; left: 0;
            
            background: var(--black);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--white);
            overflow: hidden; 
            
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .screen-container {
            width: 100%;
            max-width: 450px; 
            height: 100%;
            display: flex;
            flex-direction: column;
            /* Убрали верхний padding контейнера, чтобы header прижался к самому верху */
            padding: 0 0 8px 0; 
            box-sizing: border-box;
            z-index: 10;
        }

        header {
            text-align: center;
            /* НОЛЬ отступа снизу! Видео начнется сразу под текстом */
            margin-bottom: 0; 
            padding: 8px 12px 2px 12px; /* Минимальный padding только для текста */
            flex-shrink: 0; 
        }

        h1 {
            color: var(--gold);
            font-size: 1.1rem; 
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.1;
        }

        h2 {
            color: var(--white);
            font-size: 1.3rem; 
            font-weight: 700;
            margin-top: 2px; 
            margin-bottom: 0; /* Критически важно: ноль отступа до видео */
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        /* --- ВИДЕО ВПЛОТНУЮ --- */
        .media-wrapper {
            position: relative;
            width: 100%;
            
            /* Прямые углы сверху для идеальной стыковки с текстом */
            border-radius: 0 0 12px 12px;
            
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #333;
            border-top: none; /* Убираем линию сверху */
            background: #000;
            
            flex-grow: 1; 
            display: flex;
            align-items: center;
            justify-content: center;
            
            margin: 0; /* Абсолютно ноль отступов */
        }

        img.cover-image {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 2;
            transition: opacity 0.8s ease;
        }

        video.main-video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover; 
            display: block;
            z-index: 1;
            opacity: 0; 
            transition: opacity 0.8s ease;
        }

        .is-playing img.cover-image {
            opacity: 0; 
            pointer-events: none;
        }
        .is-playing video.main-video {
            opacity: 1; 
        }

        footer {
            text-align: center;
            margin-top: 6px; /* Единственный небольшой отступ после видео */
            flex-shrink: 0; 
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 0 12px;
        }

        p.wishes {
            font-size: 0.8rem; 
            line-height: 1.3;
            color: #ddd;
            margin: 0;
            white-space: pre-line;
        }

        .play-btn {
            background: linear-gradient(135deg, var(--gold) 0%, var(--dark-gold) 100%);
            border: none;
            color: #000;
            font-weight: bold;
            font-size: 0.9rem;
            padding: 10px; 
            width: 100%;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
            transition: transform 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .play-btn:active {
            transform: scale(0.96);
        }

        audio { display: none; }

        canvas#confettiCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .custom-player {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 6px 10px; 
            display: none;
            align-items: center;
            gap: 8px;
            animation: fadeIn 0.5s ease forwards;
            width: 100%;
            box-sizing: border-box;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .player-btn {
            background: none;
            border: none;
            color: var(--gold);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0;
            line-height: 1;
            width: 24px;
            text-align: center;
            flex-shrink: 0;
        }

        .progress-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 4px; 
            background: #333;
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: var(--gold);
            border-radius: 3px;
            width: 0%;
            position: relative;
        }
        
        .progress-fill::after {
            content: '';
            position: absolute;
            right: -4px;
            top: -2px;
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.65rem;
            color: #aaa;
            font-family: monospace;
        }

    </style>
</head>
<body>

<canvas id="confettiCanvas"></canvas>

<div class="screen-container" id="mainContainer">
    
    <header>
        <h1>С Днём Рождения!</h1>
        <h2>Игорь Александрович</h2>
    </header>

    <!-- Видео начинается сразу под именем -->
    <div class="media-wrapper">
        <img src="IGORHBD.PNG" alt="Заставка" class="cover-image">
        
        <video id="myVideo" class="main-video" loop playsinline preload="auto" muted>
            <source src="video_igor.mp4" type="video/mp4">
        </video>
    </div>

    <footer>
        <p class="wishes">Пусть этот день будет наполнен яркими
эмоциями, теплом близких людей.
Здоровья, энергии и новых свершений!</p>

        <button id="startBtn" class="play-btn" onclick="startCelebration()">
             Открыть подарок
        </button>

        <div id="audioPlayer" class="custom-player">
            <button id="togglePlayBtn" class="player-btn">⏸</button>
            
            <div class="progress-container">
                <div class="progress-bar-bg" id="seekBarBg">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="time-info">
                    <span id="currentTime">0:00</span>
                    <span id="totalTime">0:00</span>
                </div>
            </div>
        </div>
    </footer>

</div>

<audio id="musicTrack" loop preload="auto">
    <source src="song_Igorhbd.mp3" type="audio/mpeg">
</audio>

<script>
    const video = document.getElementById('myVideo');
    const music = document.getElementById('musicTrack');
    const btn = document.getElementById('startBtn');
    const container = document.getElementById('mainContainer');
    const canvas = document.getElementById('confettiCanvas');
    const ctx = canvas.getContext('2d');

    const playerDiv = document.getElementById('audioPlayer');
    const toggleBtn = document.getElementById('togglePlayBtn');
    const seekBarBg = document.getElementById('seekBarBg');
    const progressFill = document.getElementById('progressFill');
    const currentTimeSpan = document.getElementById('currentTime');
    const totalTimeSpan = document.getElementById('totalTime');

    let isPlaying = false;
    let particles = [];

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function formatTime(seconds) {
        if (isNaN(seconds)) return "0:00";
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function startCelebration() {
        if (!isPlaying) {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                new AudioContext().resume();
            } catch(e) {}

            music.volume = 1.0;
            music.play().catch(e => console.error("Ошибка музыки:", e));

            video.muted = false; 
            video.play().then(() => {
                container.classList.add('is-playing');
            }).catch(e => {
                container.classList.add('is-playing');
            });

            btn.style.display = 'none'; 
            playerDiv.style.display = 'flex';
            
            isPlaying = true;
            startConfetti();
        }
    }

    music.addEventListener('loadedmetadata', () => {
        totalTimeSpan.textContent = formatTime(music.duration);
    });

    music.addEventListener('timeupdate', () => {
        const current = music.currentTime;
        const duration = music.duration || 1;
        const percent = (current / duration) * 100;
        
        progressFill.style.width = `${percent}%`;
        currentTimeSpan.textContent = formatTime(current);
    });

    toggleBtn.addEventListener('click', () => {
        if (music.paused) {
            music.play();
            video.play();
            toggleBtn.textContent = '';
        } else {
            music.pause();
            video.pause();
            toggleBtn.textContent = '▶';
        }
    });

    seekBarBg.addEventListener('click', (e) => {
        const rect = seekBarBg.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const width = rect.width;
        const percent = clickX / width;
        
        music.currentTime = percent * music.duration;
    });

    function startConfetti() {
        for(let i=0; i<150; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height - canvas.height,
                r: Math.random() * 6 + 2,
                dx: Math.random() * 4 - 2,
                dy: Math.random() * 4 + 2,
                color: ['#d4af37', '#ffffff', '#ff4b2b', '#0ea5e9'][Math.floor(Math.random()*4)],
                tilt: Math.floor(Math.random() * 10) - 10,
                tiltAngleIncremental: Math.random() * 0.07 + 0.05,
                tiltAngle: 0
            });
        }
        requestAnimationFrame(drawConfetti);
    }

    function drawConfetti() {
        if(!isPlaying && music.paused) return;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        particles.forEach((p, index) => {
            p.tiltAngle += p.tiltAngleIncremental;
            p.y += (Math.cos(p.tiltAngle) + 1 + p.r / 2) / 2;
            p.x += Math.sin(p.tiltAngle) * 2;
            
            if (p.y > canvas.height) {
                particles.splice(index, 1);
                particles.unshift({
                    ...p,
                    x: Math.random() * canvas.width,
                    y: -10
                });
            }

            ctx.beginPath();
            ctx.lineWidth = p.r;
            ctx.strokeStyle = p.color;
            ctx.moveTo(p.x + p.tilt + p.r, p.y);
            ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
            ctx.stroke();
        });

        requestAnimationFrame(drawConfetti);
    }
</script>

</body>
</html>
